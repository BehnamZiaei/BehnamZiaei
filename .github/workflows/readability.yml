name: Improve typography
on:
  push:
    paths:
      - '.github/workflows/readability.yml'
permissions:
  contents: write
jobs:
  typography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply readable font sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* readability-override */'
          if marker not in s:
              css = '''<style>/* readability-override */
          body{font-size:16px}
          .links a{font-size:13px}
          .eyebrow{font-size:12px}
          .lead{font-size:clamp(17px,1.75vw,20px)}
          .btn{font-size:13px;min-height:48px}
          .availability{font-size:11px}
          .head p{font-size:14px}
          .panel p{font-size:15px}
          .fact b{font-size:12px}.fact span{font-size:13px}
          .stat strong{font-size:27px}.stat span{font-size:12px}
          .skill-no{font-size:11px}.skill h3{font-size:18px}.skill p{font-size:13px}.tag{font-size:11px}
          .job h3{font-size:19px}.company{font-size:12px}.period{font-size:11px}.job ul{font-size:13px}
          .project-meta{font-size:11px}.project h3{font-size:23px}.domain{font-size:11px}.project p{font-size:13px}.project-link{font-size:12px}
          .resume-card h3{font-size:18px}.resume-card p{font-size:13px}
          .contact h2{font-size:30px}.contact p{font-size:13px}
          footer{font-size:11px}
          @media(max-width:620px){.lead{font-size:15px}.btn{font-size:13px}.head p{font-size:12px}.panel p{font-size:14px}.skill p,.job ul,.project p,.resume-card p{font-size:13px}.skill h3{font-size:18px}.project h3{font-size:21px}.contact p{font-size:13px}}
          @media(max-width:380px){.lead{font-size:14px}.btn{font-size:12px}}
          </style>'''
              s = s.replace('</head>', css + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/readability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/readability.yml
          git commit -m 'style: improve typography readability'
          git push